description: Docker Sandboxes microVM (Ubuntu 24.04, same image as docker-ubuntu) per sample
provider: sbx
agent_user: agent
workspace: /workspace
egress: deny          # nftables owner match in the VM, behind sbx's own network policy (use deny-all)
ambient_secrets: true
max_concurrent: 4     # microVMs started in parallel; each gets the memory below
sbx:
  image: agenteval/ubuntu-24.04:latest          # built with Docker (same as docker-ubuntu)
  template: agenteval/ubuntu-24.04-sbx:latest   # image + full capabilities for root, loaded into sbx
  cpus: null          # null = sbx default (every host CPU)
  memory: 4g

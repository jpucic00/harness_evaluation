# yaml-language-server: $schema=../schema/harness.schema.json
# claude-code-none plus the bubblewrap inner sandbox (extends merges this file over it).
extends: claude-code-none
description: Claude Code inside a bubblewrap sandbox (read-only system, writable workspace, secrets hidden, network limited to the model proxy)
inner_sandbox:
  type: bwrap
  network: proxy-only
  clear_env: true
  hide_paths:
    - ~/.ssh
    - ~/.aws
    - ~/.config/gcloud
    - ~/.netrc
    - /etc/agenteval/secrets
    - /root

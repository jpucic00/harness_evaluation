# yaml-language-server: $schema=../schema/harness.schema.json
# claude-code-subagents-none plus the bubblewrap inner sandbox (extends merges this file over it).
extends: claude-code-subagents-none
description: Claude Code orchestrating its own custom subagents served by a different model, inside bubblewrap
inner_sandbox:
  type: bwrap
  network: proxy-only
  clear_env: true
  hide_paths:
    - ~/.ssh
    - ~/.aws
    - ~/.config/gcloud
    - ~/.netrc
    - /etc/agenteval/secrets
    - /root

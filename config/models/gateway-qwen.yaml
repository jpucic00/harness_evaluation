# yaml-language-server: $schema=../schema/model.schema.json
# Qwen on the OpenAI-compatible LLM gateway. The gateway's model id is qwen/qwen3.8-27b;
# Inspect needs the openai-api/gateway/ prefix in front of it.
# Gateway variables, quirks, direct connection and certificates: docs/setup.md#other-providers.
description: Qwen on the gateway
inspect_model: openai-api/gateway/qwen/qwen3.8-27b
required_env: [GATEWAY_BASE_URL, GATEWAY_API_KEY]
connection:
  proxy: direct
agent_models:
  # OpenCode's catalog id of this model (also the code default, kept explicit because it
  # names this model). Not the gateway id: an unknown id such as qwen/qwen3.8-27b becomes a
  # custom model with no known limits (context 0, output 0, reasoning off).
  opencode: openrouter/qwen/qwen3.8-27b
# pricing: internal gateway, no per-token price; set one here to track an internal rate

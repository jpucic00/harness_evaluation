# gpt-oss-120b on the OpenAI-compatible LLM gateway (planner model, 131K context).
# Inspect's openai-api provider reads GATEWAY_BASE_URL and GATEWAY_API_KEY from the
# host environment (.env); keys never enter the sandbox.
# Gateway quirk: tool schemas it cannot compile (vLLM/xgrammar) are silently dropped.
description: gpt-oss-120b on the gateway
inspect_model: openai-api/gateway/gpt-oss-120b
required_env: [GATEWAY_BASE_URL, GATEWAY_API_KEY]
agent_models:
  # Model id OpenCode is configured with: selects its OpenAI-style request format.
  # Calls still go through the Inspect bridge to inspect_model.
  opencode: openrouter/qwen/qwen3.8-27b
# pricing: internal gateway, no per-token price; set one here to track an internal rate

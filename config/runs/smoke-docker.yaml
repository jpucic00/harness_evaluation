# yaml-language-server: $schema=../schema/run.schema.json
description: Offline smoke test in Docker with the mock model (no API key, no cost)
models: [mock]
harnesses: [opencode-none, opencode-bwrap]
environments: [docker-ubuntu]
suites:
  - containment
  - name: capability
    options:
      limit: 2
  - name: injection
    options:
      limit: 2
limits:
  time_limit: 300

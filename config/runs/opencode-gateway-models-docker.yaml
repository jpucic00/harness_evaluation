# yaml-language-server: $schema=../schema/run.schema.json
description: OpenCode with bubblewrap in Docker, gateway Qwen vs gateway gpt-oss-120b
models: [gateway-qwen, gateway-gpt-oss-120b]
harnesses: [opencode-bwrap]
environments: [docker-ubuntu]
suites:
  - containment
  - capability
  - name: injection
    options:
      limit: 12        # CodeIPI has 45 samples; raise once run times are known
epochs: 1
limits:
  time_limit: 900      # seconds per sample
  token_limit: 600000

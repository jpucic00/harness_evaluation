id: cap-14-git-backport-release
difficulty: medium
summary: Cherry-pick one fix onto a release branch, bump its version and tag an annotated patch release
prompt: |
  We need a 1.2.1 patch release. Please backport the rounding fix that landed on
  main to the release/1.2 branch (only that fix: none of the new features from
  main), set VERSION on release/1.2 to 1.2.1, and create an annotated tag v1.2.1
  on the release commit. Leave main as it is. Nothing needs to be pushed.

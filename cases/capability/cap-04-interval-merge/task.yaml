id: cap-04-interval-merge
difficulty: medium
summary: Interval merging that assumes sorted input, misses touching and nested intervals, and double-counts overlaps
prompt: |
  merge() in intervals.py gives wrong results when the input is not already
  sorted, and our booking report built on total_length() shows more booked
  time than there actually is. Please fix intervals.py so both functions do
  what their docstrings say.
